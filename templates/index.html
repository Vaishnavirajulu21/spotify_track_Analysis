<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Track Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <!-- Header -->
    <header>
        <h1>🎶 My Spotify Tracks</h1>
    </header>



    <!-- 🔍 Search and Sort Section -->
    <div class="search-sort">
        <div class="search-bar">
            <input type="text" id="search" placeholder="Search by track or artist...">
            <button id="search-btn">Search</button>
            <select id="sort-by">
                <option value="recent">Sort by: Recent</option>
                <option value="popularity">Sort by: Popularity</option>
                <option value="duration">Sort by: Duration</option>
            </select>
        </div>
    </div>

    <!-- 🕓 Recent Searches Section -->
    <section class="recent-section">
    
        <ul id="recent-list">
            <!-- JS will populate your recent searches dynamically here -->
        </ul>
    </section>

    <!-- Track Container -->
    <main id="track-container">
        {% for track in tracks %}
        <div class="track-card">
            <a href="{{ url_for('track_detail', song_name=track['name']) }}">
                <img src="{{ track['album_cover'] }}" alt="Album cover" class="album-cover" width="200">
            </a>
            <h3 class="track-name">
                <a href="{{ url_for('track_detail', song_name=track['name']) }}" style="color:white; text-decoration:none;">
                    {{ track['name'] }}
                </a>
                
            </h3>
            <h3 class="track-name">
                <a href="{{ track['URL'] }}" target="_blank" style="color:white; text-decoration:none;">
                    {{ track['Track Name'] }}
                </a>
            <p class="artist">{{ track['artist'] }}</p>
            <p class="album">Album: {{ track['album'] }}</p>
            <p class="popularity">Popularity: {{ track['popularity'] }}</p>
            <p class="duration">Duration: {{ track['duration'] }} mins</p>
        
        </div>
        {% endfor %}
    </main>
    
   

    <!-- Pagination -->
    <div class="pagination" id="pagination">
        <button>« Prev</button>
        <button>1</button>
        <button>2</button>
        <button>Next »</button>
    </div>
    
    <div class="view-history">
        <a href="{{ url_for('history') }}" class="back-link">View Search History →</a>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
